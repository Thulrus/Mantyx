<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Mantyx</title>
    <link rel="icon" href="/static/logo.png" />
    <link rel="stylesheet" href="/static/css/style.css?v=__MANTYX_VERSION__" />
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Mantyx home">
        <img src="/static/logo.png" alt="" class="brand-logo" />
        <span class="brand-name">Mantyx</span>
      </a>
      <div class="topbar-status">
        <span id="connection" class="connection" data-state="ok" title="Connected to Mantyx">
          <span class="connection-dot"></span>
          <span class="connection-label">Connected</span>
        </span>
        <span id="clock" class="clock" title="Server timezone (used for schedules)"></span>
      </div>
      <nav class="topbar-actions">
        <button type="button" class="btn btn-ghost" data-action="open-guide">
          <span data-icon="book"></span><span class="hide-sm">Guide</span>
        </button>
        <button type="button" class="btn btn-ghost" data-action="open-settings">
          <span data-icon="settings"></span><span class="hide-sm">Settings</span>
        </button>
        <button type="button" class="btn btn-primary" data-action="add-app">
          <span data-icon="plus"></span><span>Add app</span>
        </button>
      </nav>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <main id="view" class="view" tabindex="-1"></main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Generic dialog shell; content is rendered by main.js -->
    <dialog id="dialog" class="dialog" aria-labelledby="dialogTitle">
      <form method="dialog" class="dialog-frame" id="dialogForm" novalidate>
        <header class="dialog-header">
          <h2 id="dialogTitle"></h2>
          <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="dialog-body" id="dialogBody"></div>
        <footer class="dialog-footer" id="dialogFooter"></footer>
      </form>
    </dialog>

    <!-- Confirmation prompt (stacks above the generic dialog) -->
    <dialog id="confirm" class="dialog dialog-sm" aria-labelledby="confirmTitle">
      <form method="dialog" class="dialog-frame" id="confirmForm" novalidate>
        <header class="dialog-header">
          <h2 id="confirmTitle"></h2>
        </header>
        <div class="dialog-body" id="confirmBody"></div>
        <footer class="dialog-footer">
          <button type="button" class="btn btn-ghost" data-confirm="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" data-confirm="ok" id="confirmOk">OK</button>
        </footer>
      </form>
    </dialog>

    <script src="/static/js/ui.js?v=__MANTYX_VERSION__"></script>
    <script src="/static/js/schedule.js?v=__MANTYX_VERSION__"></script>
    <script src="/static/js/main.js?v=__MANTYX_VERSION__"></script>
  </body>
</html>
